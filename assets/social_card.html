<!DOCTYPE html>
<html>
<head>
    <title>FissionBypass Pro - Social Card</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .card {
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            border-radius: 24px;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 2px solid #333;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .logo {
            display: flex;
            align-items: baseline;
            gap: 12px;
        }
        .logo h1 {
            font-size: 64px;
            font-weight: 900;
            color: #fff;
            letter-spacing: -2px;
        }
        .logo .pro {
            font-size: 28px;
            font-weight: 700;
            color: #ef4444;
            background: rgba(239, 68, 68, 0.15);
            padding: 4px 12px;
            border-radius: 6px;
        }
        .badge {
            background: #10b981;
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            padding: 12px 24px;
            border-radius: 50px;
        }
        .tagline {
            font-size: 32px;
            color: #9ca3af;
            margin-top: 20px;
        }
        .features {
            display: flex;
            gap: 30px;
            margin-top: 40px;
        }
        .feature {
            background: #1f1f1f;
            border-radius: 16px;
            padding: 30px 40px;
            text-align: center;
            border: 2px solid #333;
            flex: 1;
        }
        .feature.highlight {
            border-color: #ef4444;
        }
        .feature .num {
            font-size: 48px;
            font-weight: 900;
            color: #fff;
        }
        .feature.highlight .num {
            color: #ef4444;
        }
        .feature .label {
            font-size: 18px;
            color: #6b7280;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .speed-demo {
            background: #111;
            border-radius: 12px;
            padding: 24px 40px;
            font-family: 'Courier New', monospace;
            font-size: 24px;
            color: #6b7280;
            text-align: center;
            margin-top: 30px;
        }
        .speed-demo .arrow {
            color: #10b981;
            margin: 0 8px;
        }
        .speed-demo .fast {
            color: #10b981;
        }
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .github {
            font-size: 20px;
            color: #6b7280;
        }
        .copyright {
            font-size: 16px;
            color: #4b5563;
        }
    </style>
</head>
<body>
    <div class="card">
        <div>
            <div class="header">
                <div class="logo">
                    <h1>FISSIONBYPASS</h1>
                    <span class="pro">PRO</span>
                </div>
                <div class="badge">FREE DOWNLOAD</div>
            </div>
            <div class="tagline">CNC G-Code Optimizer for Faster Machining</div>
        </div>
        
        <div class="features">
            <div class="feature highlight">
                <div class="num">40-60%</div>
                <div class="label">Faster Cycles</div>
            </div>
            <div class="feature">
                <div class="num">14</div>
                <div class="label">Controllers</div>
            </div>
            <div class="feature">
                <div class="num">15</div>
                <div class="label">Materials</div>
            </div>
            <div class="feature">
                <div class="num">23MB</div>
                <div class="label">Portable EXE</div>
            </div>
        </div>
        
        <div class="speed-demo">
            F2 <span class="arrow">→</span> <span class="fast">F20</span>
            &nbsp;&nbsp;|&nbsp;&nbsp;
            F5 <span class="arrow">→</span> <span class="fast">F50</span>
            &nbsp;&nbsp;|&nbsp;&nbsp;
            F40 <span class="arrow">→</span> <span class="fast">F800</span>
        </div>
        
        <div class="footer">
            <div class="github">github.com/DeadlySIn777/Fissionbypass</div>
            <div class="copyright">© 2025-2026 Luis Angel Garcia</div>
        </div>
    </div>
</body>
</html>
