<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGrad)" rx="20"/>
  
  <!-- Decorative lines -->
  <line x1="50" y1="80" x2="750" y2="80" stroke="#333" stroke-width="1"/>
  <line x1="50" y1="320" x2="750" y2="320" stroke="#333" stroke-width="1"/>
  
  <!-- Main Title -->
  <text x="400" y="130" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="52" font-weight="900" fill="#ffffff">
    FISSIONBYPASS
  </text>
  <text x="400" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#ef4444" font-weight="bold">
    PRO
  </text>
  
  <!-- Tagline -->
  <text x="400" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#9ca3af">
    CNC G-Code Optimizer
  </text>
  
  <!-- Feature boxes -->
  <g transform="translate(80, 250)">
    <rect width="140" height="50" fill="#1f1f1f" rx="8" stroke="#ef4444" stroke-width="2"/>
    <text x="70" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#ef4444" font-weight="bold">40-60%</text>
    <text x="70" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#9ca3af">FASTER</text>
  </g>
  
  <g transform="translate(250, 250)">
    <rect width="140" height="50" fill="#1f1f1f" rx="8" stroke="#6b7280" stroke-width="2"/>
    <text x="70" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold">14</text>
    <text x="70" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#9ca3af">CONTROLLERS</text>
  </g>
  
  <g transform="translate(420, 250)">
    <rect width="140" height="50" fill="#1f1f1f" rx="8" stroke="#6b7280" stroke-width="2"/>
    <text x="70" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold">15</text>
    <text x="70" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#9ca3af">MATERIALS</text>
  </g>
  
  <g transform="translate(590, 250)">
    <rect width="140" height="50" fill="#1f1f1f" rx="8" stroke="#10b981" stroke-width="2"/>
    <text x="70" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#10b981" font-weight="bold">FREE</text>
    <text x="70" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#9ca3af">DOWNLOAD</text>
  </g>
  
  <!-- Speed example -->
  <text x="400" y="355" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="#6b7280">
    F2 → F20  |  F5 → F50  |  F40 → F800
  </text>
  
  <!-- Corner accent -->
  <polygon points="0,0 60,0 0,60" fill="#ef4444"/>
  <polygon points="800,400 740,400 800,340" fill="#ef4444"/>
</svg>